name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      # smoke.py resolves the launcher per-OS itself: the dist .bat on
      # Windows, the release binary directly on Linux/macOS.
      - name: Smoke tests (fake PG 8.3 server)
        run: python smoke/smoke.py
