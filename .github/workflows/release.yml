name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test (native targets)
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Assemble plugin package
        shell: bash
        run: |
          set -euo pipefail
          root="dist/dbx-pg83-compat"
          mkdir -p "$root/bin"
          cp "target/${{ matrix.target }}/release/dbx-pg83-driver${{ matrix.ext }}" "$root/bin/"
          cp manifest.json "$root/manifest.json"
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            # DBX prefers the .bat launcher on Windows when both exist.
            cat > "$root/bin/dbx-pg83-driver.bat" <<'BATEOF'
          @echo off
          rem DBX loads the .bat launcher on Windows (resolve_existing_backend_path).
          setlocal
          set "HERE=%~dp0"
          "%HERE%dbx-pg83-driver.exe" %*
          endlocal
          BATEOF
          else
            chmod +x "$root/bin/dbx-pg83-driver"
          fi

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            7z a "dbx-pg83-compat-${{ matrix.platform }}.zip" dbx-pg83-compat
          else
            tar czf "dbx-pg83-compat-${{ matrix.platform }}.tar.gz" dbx-pg83-compat
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbx-pg83-compat-${{ matrix.platform }}
          path: |
            dist/dbx-pg83-compat-*

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dbx-pg83-compat-*
          generate_release_notes: true
